<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Câmara de Comércio de Santo Antônio de Jesus">
    <title>Agradecimento | Câmara de Comércio</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222
        }

        header,
        footer {
            background: #17324d;
            color: white;
            padding: 24px;
            text-align: center
        }

        nav {
            background: #244866;
            padding: 16px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap
        }

        nav a {
            color: white
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 24px
        }

        .container {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 30px
        }

        form,
        .card,
        .result {
            background: white;
            padding: 24px;
            border: 1px solid #ccc;
            border-radius: 10px
        }

        label {
            display: block;
            margin-bottom: 18px;
            font-weight: bold
        }

        input,
        select,
        textarea {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #777;
            border-radius: 5px;
            font: inherit
        }

        textarea {
            min-height: 120px;
            resize: vertical
        }

        button {
            background: #17324d;
            color: white;
            padding: 12px 20px;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
            font: inherit
        }

        button[type=submit] {
            width: 100%
        }

        .card {
            text-align: center;
            margin-bottom: 20px;
            animation: aparecer 1.5s ease both;
            border-top: 6px solid var(--tier)
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        dialog {
            border: 0;
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 450px
        }

        dialog::backdrop {
            background: #0009
        }

        footer {
            margin-top: 30px
        }

        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid #c07400;
            outline-offset: 3px
        }

        dd {
            margin: 6px 0 20px;
            overflow-wrap: anywhere
        }

        dt {
            font-weight: bold
        }

        @media(max-width:768px) {
            .container {
                grid-template-columns: 1fr
            }
        }

        @media(prefers-reduced-motion:reduce) {
            .card {
                animation: none
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Câmara de Comércio</h1>
        <p>Santo Antônio de Jesus – Bahia</p>
    </header>
    <nav aria-label="Navegação principal"><a href="index.html">Início</a><a href="associacao.html">Associação</a></nav>
    <main>
        <h2>Obrigado pela sua solicitação!</h2>
        <p>Confira as informações enviadas.</p>
        <dl class="result" id="dados"></dl><a href="associacao.html">Voltar ao formulário</a>
    </main>
    <footer>
        <p>Câmara de Comércio de Santo Antônio de Jesus</p>
        <p>Projeto WDD231</p>
    </footer>
    <script>const params = new URLSearchParams(location.search); const fields = { nome: 'Nome', sobrenome: 'Sobrenome', email: 'E-mail', celular: 'Celular', empresa: 'Empresa', timestamp: 'Data e hora' }; for (const [key, label] of Object.entries(fields)) { const dt = document.createElement('dt'); const dd = document.createElement('dd'); dt.textContent = label; let value = params.get(key) || 'Não informado'; if (key === 'timestamp' && params.has(key)) { const date = new Date(value); if (!isNaN(date)) value = date.toLocaleString('pt-BR') } dd.textContent = value; document.getElementById('dados').append(dt, dd) }</script>
</body>

</html>
